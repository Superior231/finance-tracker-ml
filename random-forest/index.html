<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Test Receipt Parser API</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
            color: #222;
        }

        h1 {
            font-size: 22px;
        }

        #drop {
            border: 2px dashed #999;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            color: #666;
            cursor: pointer;
        }

        #drop.hover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        button {
            margin-top: 16px;
            padding: 10px 18px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:disabled {
            background: #93b6ec;
            cursor: not-allowed;
        }

        .item-form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .item-form-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .input-name {
            flex: 2;
        }

        .input-qty {
            flex: 0.5;
            width: 50px;
        }

        .input-price {
            flex: 1;
        }

        #formContainer {
            margin-top: 20px;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fbfbfb;
        }

        #status {
            margin-top: 12px;
            font-size: 14px;
        }

        #preview {
            max-width: 200px;
            margin-top: 12px;
            border-radius: 6px;
        }

        .btn-secondary {
            background: #4b5563;
        }
    </style>
</head>

<body>

    <h1>🧾 Test Receipt Parser API</h1>
    <p>Pilih atau seret foto nota, lalu klik "Parse Nota". Hasil akan otomatis mengisi form di bawah.</p>

    <div id="drop">Klik atau seret gambar nota ke sini</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <img id="preview" style="display:none">
    <br>
    <button id="parseBtn" disabled>Parse Nota</button>

    <div id="status"></div>

    <div id="formContainer" style="display: none;">
        <h3>📋 Data Item Nota</h3>
        <form id="receiptForm">
            <div id="dynamicInputs">
            </div>

            <button type="button" id="addMoreBtn" class="btn-secondary">+ Tambah Item</button>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

            <div style="text-align: right; font-size: 16px;">
                <b>Total Terhitung: <span id="totalLabel">Rp 0</span></b>
            </div>

            <button type="submit" style="background: #10b981; width: 100%;">Simpan Data</button>
        </form>
    </div>

    <script>
        const API_URL = "http://localhost:5000/api/parse-receipt";

        const drop = document.getElementById('drop');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const parseBtn = document.getElementById('parseBtn');
        const statusEl = document.getElementById('status');
        const formContainer = document.getElementById('formContainer');
        const dynamicInputs = document.getElementById('dynamicInputs');
        const totalLabel = document.getElementById('totalLabel');
        const addMoreBtn = document.getElementById('addMoreBtn');
        const receiptForm = document.getElementById('receiptForm');

        let selectedFile = null;

        drop.addEventListener('click', () => fileInput.click());
        drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hover'); });
        drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
        drop.addEventListener('drop', e => {
            e.preventDefault();
            drop.classList.remove('hover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', e => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            selectedFile = file;
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
            parseBtn.disabled = false;
            statusEl.textContent = '';
            formContainer.style.display = 'none';
            dynamicInputs.innerHTML = '';
        }

        parseBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            parseBtn.disabled = true;
            statusEl.textContent = '⏳ Memproses nota, mohon tunggu...';
            formContainer.style.display = 'none';
            dynamicInputs.innerHTML = '';

            const formData = new FormData();
            formData.append('image', selectedFile);

            try {
                const res = await fetch(API_URL, { method: 'POST', body: formData });
                const json = await res.json();

                if (!res.ok || !json.success) {
                    statusEl.textContent = '❌ Gagal: ' + (json.error || JSON.stringify(json.data));
                    parseBtn.disabled = false;
                    return;
                }

                statusEl.textContent = '✅ Berhasil diparse!';
                fillFormInputs(json.data);
            } catch (err) {
                statusEl.textContent = '❌ Error koneksi ke API: ' + err.message;
            } finally {
                parseBtn.disabled = false;
            }
        });

        // Fungsi untuk membuat baris input baru (bisa dipanggil berkali-kali)
        function createItemRow(itemName = '', qty = 1, price = 0) {
            const div = document.createElement('div');
            div.className = 'item-form-group';

            div.innerHTML = `
                <input type="text" class="input-name" placeholder="Nama Item" value="${itemName}" required>
                <input type="number" class="input-qty" placeholder="Qty" value="${qty}" min="1" required>
                <input type="number" class="input-price" placeholder="Harga" value="${price}" min="0" required>
                <button type="button" style="margin-top:0; padding: 8px 12px; background:#ef4444;" onclick="this.parentElement.remove(); calculateTotal();">X</button>
            `;

            // Pasang event listener untuk update total otomatis saat input diubah manual
            div.querySelector('.input-qty').addEventListener('input', calculateTotal);
            div.querySelector('.input-price').addEventListener('input', calculateTotal);

            dynamicInputs.appendChild(div);
        }

        // Mengisi form berdasarkan data dari API
        function fillFormInputs(data) {
            const items = data.items || [];
            dynamicInputs.innerHTML = ''; // bersihkan form lama

            if (items.length === 0) {
                createItemRow(); // kasi 1 baris kosong kalau data kosong
            } else {
                items.forEach(it => {
                    createItemRow(it.item_name, it.qty, it.price);
                });
            }

            formContainer.style.display = 'block';
            calculateTotal();
        }

        // Menghitung total harga dari seluruh input form
        function calculateTotal() {
            let total = 0;
            const rows = dynamicInputs.querySelectorAll('.item-form-group');

            rows.forEach(row => {
                const qty = parseFloat(row.querySelector('.input-qty').value) || 0;
                const price = parseFloat(row.querySelector('.input-price').value) || 0;
                total += qty * price;
            });

            totalLabel.textContent = 'Rp ' + total.toLocaleString('id-ID');
        }

        // Tombol tambah item manual
        addMoreBtn.addEventListener('click', () => {
            createItemRow();
        });

        // Event saat form disubmit (misal untuk dikirim ke database Anda selanjutnya)
        receiptForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const rows = dynamicInputs.querySelectorAll('.item-form-group');
            const updatedItems = [];

            rows.forEach(row => {
                updatedItems.push({
                    item_name: row.querySelector('.input-name').value,
                    qty: parseInt(row.querySelector('.input-qty').value),
                    price: parseInt(row.querySelector('.input-price').value)
                });
            });

            console.log("Data siap disimpan:", updatedItems);
            alert("Data berhasil dikumpulkan! Cek console log untuk melihat object data.");
        });
    </script>

</body>

</html>
